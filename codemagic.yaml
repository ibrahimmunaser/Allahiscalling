workflows:

  # ────────────────────────────────────────────────────────────────────────────
  # Android — builds a signed App Bundle and publishes to Google Play
  #
  # Prerequisites in Codemagic (Team settings → Environment variables),
  # as two variable GROUPS so the names below resolve — mark every one of
  # these "Secure":
  #
  #   Group "android_signing":
  #     ANDROID_KEYSTORE_BASE64   — `certutil -encode upload-keystore.jks keystore.b64`
  #                                 (Windows) or `base64 -i upload-keystore.jks`
  #                                 (Mac/Linux), paste the single-line result
  #                                 (strip certutil's BEGIN/END lines if present)
  #     ANDROID_KEYSTORE_PASSWORD — same values as android/key.properties
  #     ANDROID_KEY_ALIAS
  #     ANDROID_KEY_PASSWORD
  #
  #   Group "google_play":
  #     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS — paste the FULL JSON content of a
  #       Google Cloud service account key that has been granted access in
  #       Play Console → Setup → API access, with at least "Release manager"
  #       permission for this app. Create the key in Google Cloud Console
  #       (IAM & Admin → Service Accounts → Keys → Add key → JSON).
  #
  # This app must already exist in Play Console with at least one manually
  # uploaded release before the Google Play Developer API will accept a
  # publish — a brand-new app cannot be created via this API.
  #
  # Ships straight to the "production" track with no manual review step on
  # your end once this build succeeds — double-check this is really what
  # you want before pushing a tag; switch `track: production` to
  # `track: internal` below for a safer first run if in doubt.
  # ────────────────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      flutter: stable
      vars:
        PRIVACY_POLICY_URL: https://ibrahimmunaser.github.io/Allahiscalling/
        SUPPORT_EMAIL: themuslimman77@gmail.com
        WEBSITE_URL: https://ibrahimmunaser.github.io/Allahiscalling/
      groups:
        - android_signing
        - google_play

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
        # Android-only builds (APK/AAB) without also starting ios-release.
        # A normal v* tag still builds both platforms.
        - pattern: 'android-v*'
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up Android release signing
        script: |
          set -e
          KEYSTORE_PATH="$CM_BUILD_DIR/android/app/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          # android/app/build.gradle.kts reads these exact env var names as
          # a fallback when android/key.properties doesn't exist (which it
          # doesn't on CI) — see signingValue() there.
          cat >> "$CM_ENV" <<EOF
          ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH
          EOF

      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL \
            --dart-define=SUPPORT_EMAIL=$SUPPORT_EMAIL \
            --dart-define=WEBSITE_URL=$WEBSITE_URL

      - name: Build installable APK (for sideloading / phone testing)
        script: |
          flutter build apk --release \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL \
            --dart-define=SUPPORT_EMAIL=$SUPPORT_EMAIL \
            --dart-define=WEBSITE_URL=$WEBSITE_URL

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - themuslimman77@gmail.com
        notify:
          success: true
          failure: true
      # Google Play publishing is disabled until the Foreground Service
      # declaration (Play Console → App content → Foreground service
      # permissions) is completed for this app — the API rejects the
      # release with "You must let us know whether your app uses any
      # Foreground Service permissions" otherwise, which fails the whole
      # build even though the .aab/.apk artifacts were already produced.
      # Re-enable once that declaration is saved in Play Console:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: production
      #   submit_as_draft: false

  # ────────────────────────────────────────────────────────────────────────────
  # iOS — one-time: create App Store provisioning profile on Apple
  #
  # Run this ONCE manually in Codemagic (or via a `profile-*` tag) if Fetch
  # profiles shows 0 for this app's bundle ID. After it succeeds:
  #   Code signing → iOS provisioning profiles → Fetch profiles
  #   → select com.salahinvite.allahInvitesYouToSalah App Store profile
  #   → reference name: salah_appstore
  # ────────────────────────────────────────────────────────────────────────────
  ios-create-profile:
    name: iOS Create Profile
    max_build_duration: 15
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      vars:
        BUNDLE_ID: com.salahinvite.allahInvitesYouToSalah
        PROFILE_NAME: Allah Invites You to Salah App Store
        # Set to 1 (as a Codemagic env var on this workflow) only once Apple
        # has approved the Family Controls distribution entitlement — then
        # this also creates profiles for the 3 Screen Time extension bundle
        # IDs. See IOS_SCREEN_TIME_SETUP.md.
        ENABLE_SCREEN_TIME_EXTENSIONS: 0

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'profile-*'
          include: true

    scripts:
      - name: Create App Store provisioning profile(s) on Apple
        script: |
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          CERT_ID=$(app-store-connect certificates list --json | python3 -c "
          import json, sys
          certs = json.load(sys.stdin)
          preferred = ('IOS_DISTRIBUTION', 'DISTRIBUTION')
          for cert_type in preferred:
              for cert in certs:
                  attrs = cert.get('attributes') or {}
                  if attrs.get('certificateType') == cert_type:
                      print(cert['id'])
                      break
              else:
                  continue
              break
          else:
              sys.exit('No distribution certificate found on Apple Developer Portal')
          ")

          # Each entry: "<bundle id>|<profile name>|<reference name to fetch in Codemagic UI>"
          PROFILE_JOBS=("$BUNDLE_ID|$PROFILE_NAME|salah_appstore")
          if [ "$ENABLE_SCREEN_TIME_EXTENSIONS" = "1" ]; then
            PROFILE_JOBS+=(
              "$BUNDLE_ID.deviceactivitymonitor|Allah Invites You to Salah DeviceActivityMonitor|salah_appstore_deviceactivitymonitor"
              "$BUNDLE_ID.shieldconfiguration|Allah Invites You to Salah ShieldConfiguration|salah_appstore_shieldconfiguration"
              "$BUNDLE_ID.shieldaction|Allah Invites You to Salah ShieldAction|salah_appstore_shieldaction"
            )
          fi

          for job in "${PROFILE_JOBS[@]}"; do
            IFS='|' read -r JOB_BUNDLE_ID JOB_PROFILE_NAME JOB_REF_NAME <<< "$job"
            export JOB_BUNDLE_ID

            if app-store-connect profiles list \
                --type IOS_APP_STORE \
                --name "$JOB_PROFILE_NAME" \
                --profiles-dir "$PROFILE_DIR" \
                --save && compgen -G "$PROFILE_DIR"/*.mobileprovision > /dev/null; then
              echo "Profile '$JOB_PROFILE_NAME' already exists on Apple."
              continue
            fi

            echo "Registering bundle ID $JOB_BUNDLE_ID on Apple Developer Portal (if needed)..."
            BUNDLE_ID_RES=$(app-store-connect bundle-ids list --json | python3 -c "
          import json, sys, os
          bid = os.environ['JOB_BUNDLE_ID']
          for item in json.load(sys.stdin):
              attrs = item.get('attributes') or {}
              if attrs.get('identifier') == bid:
                  print(item['id'])
                  break
          else:
              sys.exit('MISSING')
          " || echo MISSING)

            if [ "$BUNDLE_ID_RES" = "MISSING" ]; then
              BUNDLE_ID_RES=$(app-store-connect bundle-ids create "$JOB_BUNDLE_ID" \
                --name "$JOB_PROFILE_NAME" \
                --platform IOS --json | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            fi

            echo "Creating App Store provisioning profile '$JOB_PROFILE_NAME' on Apple Developer Portal..."
            app-store-connect profiles create "$BUNDLE_ID_RES" \
              --certificate-ids "$CERT_ID" \
              --type IOS_APP_STORE \
              --name "$JOB_PROFILE_NAME" \
              --profiles-dir "$PROFILE_DIR" \
              --save

            echo "Done. Now fetch in Codemagic UI with reference: $JOB_REF_NAME"
          done

  # ────────────────────────────────────────────────────────────────────────────
  # iOS — builds a signed IPA and uploads to TestFlight
  #
  # Prerequisites in Codemagic Team Settings (already set up for this account):
  #   1. Integrations → Apple Developer Portal → API key named "Codemagic"
  #   2. Code signing → iOS certificates → "themuslimman certificate" (production,
  #      team-wide — reused across apps on this Apple Developer account)
  #   3. Run ios-create-profile once, then Fetch profiles → reference: salah_appstore
  # ────────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.salahinvite.allahInvitesYouToSalah
        PRIVACY_POLICY_URL: https://ibrahimmunaser.github.io/Allahiscalling/
        SUPPORT_EMAIL: themuslimman77@gmail.com
        WEBSITE_URL: https://ibrahimmunaser.github.io/Allahiscalling/
      ios_signing:
        # Once ENABLE_SCREEN_TIME_EXTENSIONS=1 and Apple has approved the
        # Family Controls entitlement, add 3 more fetched profiles here —
        # one per extension bundle ID — see IOS_SCREEN_TIME_SETUP.md.
        provisioning_profiles:
          - salah_appstore
        certificates:
          - themuslimman certificate

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up Screen Time extension targets (App Guard)
        script: |
          # No-op unless ENABLE_SCREEN_TIME_EXTENSIONS=1 is set as a Codemagic
          # environment variable — see ios/scripts/setup_screen_time_targets.rb
          # and IOS_SCREEN_TIME_SETUP.md. Safe to always run.
          gem install xcodeproj --no-document
          ruby ios/scripts/setup_screen_time_targets.rb

      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing on Xcode project
        script: |
          cat > /Users/builder/export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist /Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL \
            --dart-define=SUPPORT_EMAIL=$SUPPORT_EMAIL \
            --dart-define=WEBSITE_URL=$WEBSITE_URL

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - themuslimman77@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
